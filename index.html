<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pokelikegame</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:monospace;color:#172018;image-rendering:pixelated}
#game{position:fixed;inset:0;width:100vw;height:100dvh;min-height:0;margin:0;background:#d8c58c}
#game>h1{display:none}
.screen{display:none}.screen.active{display:block!important}
#exploreScreen{position:absolute;inset:0;padding:0;background:#6f9d4a}
#exploreScreen .world-topbar{position:absolute;z-index:5;top:0;left:0;right:0;height:34px;padding:0 12px;background:rgba(35,55,35,.92);color:#f5e7af;font-size:12px;border-bottom:2px solid #162517}
#exploreScreen .map-wrap{position:absolute;inset:34px 0 0;border:0;padding:0;box-shadow:none;background:#6f9d4a}
#exploreScreen #map{width:100%;height:100%;aspect-ratio:auto;display:block}
#exploreScreen .map-hint{left:12px;right:12px;bottom:74px}
#exploreScreen .map-log{position:absolute;z-index:5;left:10px;right:10px;bottom:8px;margin:0;min-height:56px;padding:8px;background:rgba(243,226,173,.94);border:2px solid #6b5632;box-shadow:2px 2px 0 #9a8050;font-size:11px}

.world-topbar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:11px;color:#34422c}
.map-wrap{position:relative;border:5px solid #25251e;background:#111711;padding:2px;box-shadow:0 4px 0 #0a0d0a}
#map{display:block;width:100%;height:auto;aspect-ratio:15/11;image-rendering:pixelated;touch-action:none}
.map-hint{position:absolute;left:13px;right:13px;bottom:10px;padding:5px 7px;background:rgba(248,231,176,.94);border:2px solid #5d4b2d;font-size:9px;text-align:center;box-shadow:2px 2px 0 #352c1d}
.map-log{margin-top:6px;min-height:39px;padding:7px 8px;background:#f3e2ad;border:2px solid #6b5632;box-shadow:0 3px 0 #9a8050;font-size:10px;line-height:1.35}
.dpad{display:none}
.dpad button{border:2px solid #263326;background:#3d573e;color:#f4e5ac;font-size:16px;font-weight:bold}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.explore-team{position:absolute;display:none}
.explore-team-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #c5ae76}.explore-team-row:last-child{border:0}
#combatScreen{position:absolute;inset:0;padding:44px 10px 10px;background:#d8c58c;min-height:100dvh;overflow:auto}
#combatScreen h1{font-size:15px;text-align:center;margin:3px 0 7px}
.arena,.panel{background:#f0dfaa;border:2px solid #6b5632;box-shadow:0 3px 0 #9a8050;padding:8px;margin-bottom:7px}
.monster-row{display:flex;gap:8px;align-items:center}.monster-icon{width:54px;font-size:38px;text-align:center}.monster-info{flex:1}.monster-name{font-weight:bold;font-size:14px}.types{font-size:9px;margin:2px 0 5px}
.hp-bg{height:10px;background:#a99569;border:2px solid #6a5635}.hp{height:100%;background:#4e8e4b}.hp-text{font-size:9px;margin-top:2px}
.status{text-align:center;min-height:35px;padding:5px;font-size:11px}
.attacks{display:grid;grid-template-columns:1fr 1fr;gap:5px}.attack{min-height:57px;padding:6px;background:#e5ce94;border:2px solid #725a35;color:#182018;font-family:monospace}.attack-name{font-weight:bold;font-size:11px}.attack-info{font-size:8px;margin-top:3px}
.team{display:flex;gap:4px}.team button,.capture-button,.reset{border:2px solid #725a35;background:#e5ce94;color:#182018;padding:7px;font-family:monospace;font-weight:bold}.team button{flex:1;font-size:9px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:9px}.stat{background:#dfca91;padding:4px}
.capture-panel{display:grid;grid-template-columns:1fr 1fr;gap:5px}.reset{width:100%;margin-top:6px}
</style>
</head>
<body>
<div id="game">
<h1>POKELIKEGAME · VALBOIS</h1>

<div id="exploreScreen" class="screen active">
  <div class="world-topbar"><b id="areaTitle">Maison du professeur</b><span>✦ <b id="coins">0</b></span></div>
  <div class="map-wrap"><canvas id="map" width="480" height="352"></canvas><div id="mapHint" class="map-hint">Approche-toi de la table.</div></div>
  <div id="exploreLog" class="map-log">Trois jeunes créatures t'attendent. Le choix qui commence ton aventure est devant toi.</div>
  <div class="dpad"><button class="up" onclick="movePlayer(0,-1)">▲</button><button class="left" onclick="movePlayer(-1,0)">◀</button><button class="down" onclick="movePlayer(0,1)">▼</button><button class="right" onclick="movePlayer(1,0)">▶</button></div>
  <div class="explore-team"><b>ÉQUIPE</b><div id="exploreTeam"></div></div>
</div>

<div id="combatScreen" class="screen">
<h1>COMBAT</h1>
<div class="arena"><div class="monster-row"><div class="monster-icon" id="enemyIcon">💧</div><div class="monster-info"><div class="monster-name" id="enemyName"></div><div class="types" id="enemyTypes"></div><div class="hp-bg"><div class="hp" id="enemyHpBar"></div></div><div class="hp-text">PV <span id="enemyHpText"></span>/<span id="enemyMaxHp"></span></div></div></div></div>
<div class="status" id="message"></div>
<div class="arena"><div class="monster-row"><div class="monster-icon" id="playerIcon">🔥</div><div class="monster-info"><div class="monster-name" id="playerName"></div><div class="types" id="playerTypes"></div><div class="hp-bg"><div class="hp" id="playerHpBar"></div></div><div class="hp-text">PV <span id="playerHpText"></span>/<span id="playerMaxHp"></span></div></div></div></div>
<div class="panel"><b>ÉQUIPE</b><div class="team" id="teamButtons"></div></div>
<div class="panel"><b>ATTAQUES</b><div class="attacks" id="attacks"></div></div>
<div class="capture-panel"><button class="capture-button" onclick="attemptCapture()">CAPTURER</button><button class="capture-button" onclick="fleeBattle()">FUIR</button></div>
<div class="panel"><b>STATISTIQUES</b><div class="stats" id="stats"></div><div style="font-size:9px;margin-top:5px">Talent : <b id="talent">—</b></div></div>
<button class="reset" onclick="newBattle()">NOUVEAU COMBAT</button>
</div>
</div>

let playerTeam = [];
let enemy = null;
let activeIndex = 0;
let battleOver = false;
let xp = 0;
let coins = 0;
let areaIndex = 0;
const AREAS = [
  {name:"🌲 Bois de Brume", desc:"Une zone boisée proche du refuge. Des créatures sauvages peuvent apparaître dans les hautes herbes."},
  {name:"🪨 Falaises Rouges", desc:"Des rochers escarpés où les espèces Roche, Feu et Air sont plus fréquentes."},
  {name:"❄️ Vallée Blanche", desc:"Une vallée froide où l'on peut rencontrer des espèces Glace, Eau et Dragon."}
];


function randomInt(min,max) {
  return Math.floor(Math.random() * (max-min+1)) + min;
}


function generateMonster(species) {

  const s = species.stats;

  const monster = {
    name: species.name,
    icon: species.icon,
    types: [...species.types],

    vitalite: randomInt(s.vitalite[0],s.vitalite[1]),
    force: randomInt(s.force[0],s.force[1]),
    puissance: randomInt(s.puissance[0],s.puissance[1]),
    resistance: randomInt(s.resistance[0],s.resistance[1]),
    vitesse: randomInt(s.vitesse[0],s.vitesse[1]),

    talent: species.talent,

    attacks: species.attacks
      .slice()
      .sort(() => Math.random() - .5)
      .slice(0,4)
      .map(a => ({
        name:a[0],
        type:a[1],
        category:a[2],
        power:a[3],
        accuracy:a[4]
      }))
  };

  monster.maxHp = monster.vitalite;
  monster.hp = monster.maxHp;

  return monster;
}


function effectiveness(attackType, defenderTypes) {

  let multiplier = 1;

  defenderTypes.forEach(type => {

    if (TYPES[attackType] && TYPES[attackType][type]) {
      multiplier *= TYPES[attackType][type];
    }

  });

  return multiplier;
}


function formatMultiplier(value) {

  if (value === 1.5) return "×1,5";
  if (value === 0.7) return "×0,7";
  if (value === 2.25) return "×2,25";
  if (value === 0.49) return "×0,49";

  return "×" + value;
}


function iconForCategory(category) {

  if (category === "Physique") return "⚔️";
  if (category === "Spéciale") return "✨";
  return "🌀";

}


function render() {

  const player = playerTeam[activeIndex];

  document.getElementById("playerIcon").textContent = player.icon;
  document.getElementById("playerName").textContent = player.name;
  document.getElementById("playerTypes").textContent = player.types.join(" / ");

  document.getElementById("enemyIcon").textContent = enemy.icon;
  document.getElementById("enemyName").textContent = enemy.name;
  document.getElementById("enemyTypes").textContent = enemy.types.join(" / ");

  updateHp("player",player);
  updateHp("enemy",enemy);

  renderTeam();
  renderAttacks();
  renderStats();

}


function updateHp(side,monster) {

  const percent = Math.max(0,(monster.hp / monster.maxHp) * 100);

  document.getElementById(side + "HpBar").style.width = percent + "%";
  document.getElementById(side + "HpText").textContent = monster.hp;
  document.getElementById(side + "MaxHp").textContent = monster.maxHp;

}


function renderTeam() {

  const container = document.getElementById("teamButtons");

  container.innerHTML = "";

  playerTeam.forEach((monster,index) => {

    const button = document.createElement("button");

    button.textContent =
      monster.icon + " " +
      monster.name +
      " (" + monster.hp + "/" + monster.maxHp + ")";

    if (index === activeIndex) {
      button.classList.add("active");
    }

    if (monster.hp <= 0) {
      button.disabled = true;
    }

    button.onclick = () => switchMonster(index);

    container.appendChild(button);

  });

}


function renderAttacks() {

  const container = document.getElementById("attacks");

  container.innerHTML = "";

  const player = playerTeam[activeIndex];

  player.attacks.forEach(attack => {

    const button = document.createElement("button");

    button.className = "attack";

    const multiplier =
      effectiveness(attack.type,enemy.types);

    button.innerHTML = `
      <div class="attack-name">
        ${iconForCategory(attack.category)} ${attack.name}
      </div>

      <div class="attack-info">
        ${attack.type} · ${attack.category} ·
        ${attack.power > 0 ? attack.power + " PUI · " : ""}
        ${attack.accuracy}% ·
        ${formatMultiplier(multiplier)}
      </div>
    `;

    button.disabled =
      battleOver ||
      player.hp <= 0 ||
      enemy.hp <= 0;

    button.onclick = () => useAttack(attack);

    container.appendChild(button);

  });

}


function renderStats() {

  const player = playerTeam[activeIndex];

  document.getElementById("stats").innerHTML = `

    <div class="stat">❤️ Vitalité : ${player.vitalite}</div>
    <div class="stat">⚔️ Force : ${player.force}</div>
    <div class="stat">✨ Puissance : ${player.puissance}</div>
    <div class="stat">🛡️ Résistance : ${player.resistance}</div>
    <div class="stat">💨 Vitesse : ${player.vitesse}</div>

  `;

  document.getElementById("talent").textContent =
    player.talent;

}


function useAttack(attack) {

  if (battleOver) return;

  const player = playerTeam[activeIndex];

  if (player.hp <= 0 || enemy.hp <= 0) return;

  let hit =
    Math.random() * 100 <= attack.accuracy;

  if (!hit) {

    document.getElementById("message").textContent =
      player.name + " utilise " +
      attack.name +
      " mais rate !";

    setTimeout(enemyTurn,700);

    return;
  }


  if (attack.category === "Statut") {

    document.getElementById("message").textContent =
      player.name + " utilise " +
      attack.name + " !";

    setTimeout(enemyTurn,700);

    return;
  }


  let attackStat =
    attack.category === "Physique"
    ? player.force
    : player.puissance;


  let defense =
    enemy.resistance;


  const multiplier =
    effectiveness(attack.type,enemy.types);


  let damage =
    Math.max(
      1,
      Math.round(
        (attack.power * attackStat / Math.max(20,defense))
        * 0.35
        * multiplier
      )
    );


  let critical =
    Math.random() < 0.08;


  if (critical) {
    damage = Math.round(damage * 1.5);
  }


  enemy.hp =
    Math.max(0,enemy.hp - damage);


  let text =
    player.name +
    " utilise " +
    attack.name +
    " : -" +
    damage +
    " PV";


  if (critical) {
    text += " ✨ CRITIQUE !";
  }


  document.getElementById("message").textContent =
    text;


  render();


  if (enemy.hp <= 0) {

    battleOver = true;

    const rewardXp = randomInt(4, 8);
    const rewardCoins = randomInt(2, 6);
    xp += rewardXp;
    coins += rewardCoins;

    document.getElementById("message").textContent =
      "🏆 Victoire ! " + enemy.name + " est K.O.";

    renderAttacks();

    setTimeout(() => {
      showExplore("Victoire ! +" + rewardXp + " XP et +" + rewardCoins + " éclats. Tu reprends ton exploration.");
    }, 900);

    return;
  }


  setTimeout(enemyTurn,700);

}


function enemyTurn() {

  if (battleOver || enemy.hp <= 0) return;

  const player = playerTeam[activeIndex];

  const attacks = SPECIES
    .find(s => s.name === enemy.name)
    .attacks;

  const raw =
    attacks[Math.floor(Math.random() * attacks.length)];


  const attack = {
    name:raw[0],
    type:raw[1],
    category:raw[2],
    power:raw[3],
    accuracy:raw[4]
  };


  if (Math.random() * 100 > attack.accuracy) {

    document.getElementById("message").textContent =
      enemy.name +
      " utilise " +
      attack.name +
      " mais rate !";

    return;
  }


  if (attack.category === "Statut") {

    document.getElementById("message").textContent =
      enemy.name +
      " utilise " +
      attack.name +
      " !";

    return;
  }


  const attackStat =
    attack.category === "Physique"
    ? enemy.force
    : enemy.puissance;


  const multiplier =
    effectiveness(attack.type,player.types);


  let damage =
    Math.max(
      1,
      Math.round(
        (attack.power * attackStat /
        Math.max(20,player.resistance))
        * 0.35
        * multiplier
      )
    );


  player.hp =
    Math.max(0,player.hp - damage);


  document.getElementById("message").textContent =
    enemy.name +
    " utilise " +
    attack.name +
    " : -" +
    damage +
    " PV";


  render();


  if (player.hp <= 0) {

    const alive =
      playerTeam.some(m => m.hp > 0);

    if (alive) {

      document.getElementById("message").textContent =
        player.name +
        " est K.O. ! Choisis un autre monstre.";

    } else {

      battleOver = true;

      document.getElementById("message").textContent =
        "💀 Toute ton équipe est K.O.";

    }

  }

}


function switchMonster(index) {

  if (battleOver) return;

  if (index === activeIndex) return;

  if (playerTeam[index].hp <= 0) return;

  activeIndex = index;

  document.getElementById("message").textContent =
    "Tu envoies " +
    playerTeam[index].name +
    " !";

  render();

}


function showExplore(logText) {

  document.getElementById("exploreScreen").classList.add("active");

  updateExploreUI();
}

function showCombat() {

  document.getElementById("combatScreen").classList.add("active");
}

function updateExploreUI() {
  const area = AREAS[areaIndex];
  document.getElementById("areaTitle").textContent = area.name;
  document.getElementById("areaDesc").textContent = area.desc;
  document.getElementById("steps").textContent = steps;

    m.icon + ' <b>' + m.name + '</b> — ' + m.hp + '/' + m.maxHp + ' PV' +
    (i === activeIndex ? ' · actif' : '') +
    '</div>'
  ).join("");
}

function exploreStep() {
  const roll = Math.random();

  if (roll < 0.32) {
    const species = SPECIES[Math.floor(Math.random() * SPECIES.length)];
    enemy = generateMonster(species);
    battleOver = false;
    activeIndex = playerTeam.findIndex(m => m.hp > 0);
    if (activeIndex < 0) {
      playerTeam.forEach(m => m.hp = m.maxHp);
      activeIndex = 0;
    }
    showCombat();
    document.getElementById("message").textContent =
      "⚠️ Une créature sauvage apparaît : " + enemy.name + " !";
    render();
    return;
  }

  if (roll < 0.52) {
    const found = randomInt(1, 3);
    coins += found;
    updateExploreUI();
    document.getElementById("exploreLog").textContent =
      "Tu trouves " + found + " éclat" + (found > 1 ? "s" : "") + " abandonné" + (found > 1 ? "s" : "") + " sur le chemin.";
    return;
  }

  if (roll < 0.62) {
    const heal = randomInt(8, 18);
    playerTeam.forEach(m => m.hp = Math.min(m.maxHp, m.hp + heal));
    updateExploreUI();
    document.getElementById("exploreLog").textContent =
      "🌿 Une source claire te permet de récupérer " + heal + " PV à chaque membre de l'équipe.";
    return;
  }

  updateExploreUI();
  const messages = [
    "Tu avances prudemment. Le vent fait bouger les hautes herbes.",
    "Tu aperçois des traces inconnues, mais la créature a déjà disparu.",
    "Rien à signaler... pour l'instant.",
    "Tu découvres un passage qui pourrait mener plus loin dans la zone."
  ];
  document.getElementById("exploreLog").textContent = messages[Math.floor(Math.random() * messages.length)];
}

function changeArea() {
  areaIndex = (areaIndex + 1) % AREAS.length;
  document.getElementById("exploreLog").textContent =
    "Tu changes de zone et arrives dans " + AREAS[areaIndex].name + ".";
  updateExploreUI();
}

function fleeBattle() {
  if (battleOver) return;
  showExplore("🏃 Tu prends la fuite. La créature sauvage disparaît dans les environs.");
}

function newBattle() {

  battleOver = false;

  activeIndex = 0;

  playerTeam = [];

  while (playerTeam.length < 3) {

    const species =
      SPECIES[
        Math.floor(Math.random() * SPECIES.length)
      ];

    playerTeam.push(generateMonster(species));

  }


  const enemySpecies =
    SPECIES[
      Math.floor(Math.random() * SPECIES.length)
    ];


  enemy =
    generateMonster(enemySpecies);


  document.getElementById("message").textContent =
    "À toi de jouer.";


  render();

}

function chooseStarter(name){

  const species=SPECIES.find(s=>s.name===name);

function attemptCapture(){
  if(battleOver || !enemy || enemy.hp<=0) return;
  if(playerTeam.length>=3){
    document.getElementById("message").textContent = "Ton équipe est déjà complète (3 créatures).";
    return;
  }
  const chance = Math.min(.78, .22 + (1 - enemy.hp/enemy.maxHp)*.55);
  if(Math.random() < chance){
    const caught = enemy;
    caught.hp = caught.maxHp;
    playerTeam.push(caught);
    battleOver = true;
    document.getElementById("message").textContent = "✨ Capturé ! "+caught.name+" rejoint ton équipe.";
    render();
    setTimeout(()=>showExplore("Tu as capturé "+caught.name+" ! Ton équipe compte maintenant "+playerTeam.length+" créature(s)."),900);
  } else {
    document.getElementById("message").textContent = "La créature se débat et s'échappe de la capsule !";
    setTimeout(enemyTurn,650);
  }
}

function tileInfo(ch){

function shade(hex,amount){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amount));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+amount));
  const b=Math.max(0,Math.min(255,(n&255)+amount));
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function seeded(x,y){
  return ((x*374761+y*668265+17)%100)/100;
}

function drawPixelTree(ctx,x,y){
  const px=x*32, py=y*32;
  ctx.fillStyle="#365d32";ctx.fillRect(px,py+20,32,12);
  ctx.fillStyle="#244c2c";ctx.fillRect(px+5,py+11,22,18);
  ctx.fillStyle="#2e6535";ctx.fillRect(px+8,py+6,16,18);
  ctx.fillStyle="#3e7940";ctx.fillRect(px+11,py+2,10,16);
  ctx.fillStyle="#57904b";ctx.fillRect(px+12,py+4,7,6);
  ctx.fillStyle="#203f29";ctx.fillRect(px+7,py+26,18,3);
}

function drawGrass(ctx,x,y){
  const px=x*32,py=y*32;
  ctx.fillStyle="#76a94c";ctx.fillRect(px,py,32,32);
  const s=seeded(x,y);
  for(let i=0;i<4;i++){
    const gx=px+3+((s*37+i*11)%25), gy=py+25-((i*7)%9);
    ctx.strokeStyle=i%2?"#4d873e":"#5f963f";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(gx,py+29);ctx.lineTo(gx+2,gy);ctx.moveTo(gx+3,py+29);ctx.lineTo(gx+6,gy+4);ctx.stroke();
  }
}

function drawPath(ctx,x,y){
  const px=x*32,py=y*32;
  ctx.fillStyle="#c5a96f";ctx.fillRect(px,py,32,32);
  const s=seeded(x,y);
  ctx.fillStyle="#b3935c";
  ctx.fillRect(px+5+(s*13|0),py+7,2,2);
  ctx.fillRect(px+21-(s*9|0),py+21,2,2);
}

function drawWater(ctx,x,y){
  const px=x*32,py=y*32;
  ctx.fillStyle="#5599b4";ctx.fillRect(px,py,32,32);
  ctx.strokeStyle="#76bdd0";ctx.lineWidth=2;
  const off=((x+y)%2)*5;
  for(let yy=7+off;yy<30;yy+=11){
    ctx.beginPath();ctx.moveTo(px+3,py+yy);ctx.lineTo(px+13,py+yy-2);ctx.lineTo(px+24,py+yy);ctx.stroke();
  }
}

function drawHouse(ctx,x,y,ch){
  const px=x*32,py=y*32;
  if(ch==="R"){
    ctx.fillStyle="#9a4c3d";ctx.fillRect(px,py,32,32);
    ctx.fillStyle="#c2664e";
    for(let i=-32;i<40;i+=8){ctx.fillRect(px+i,py,4,32);}
    ctx.fillStyle="#71372f";ctx.fillRect(px,py+28,32,4);
  }else{
    ctx.fillStyle="#e0c084";ctx.fillRect(px,py,32,32);
    ctx.fillStyle="#7b5637";ctx.fillRect(px+4,py+5,24,3);
    ctx.fillStyle="#87a7a0";ctx.fillRect(px+7,py+11,8,9);
    ctx.fillStyle="#d9e5d3";ctx.fillRect(px+8,py+12,6,6);
    ctx.fillStyle="#87a7a0";ctx.fillRect(px+18,py+11,8,9);
    ctx.fillStyle="#d9e5d3";ctx.fillRect(px+19,py+12,6,6);
    if(ch==="H") {ctx.fillStyle="#765333";ctx.fillRect(px+13,py+22,7,10);}
  }
}

function drawFence(ctx,x,y){
  const px=x*32,py=y*32;
  ctx.fillStyle="#9b7749";ctx.fillRect(px,py+11,32,5);
  ctx.fillStyle="#c39a60";
  ctx.fillRect(px+4,py+5,4,20);ctx.fillRect(px+24,py+5,4,20);
}

function drawPlayer(ctx){
  const px=playerPos.x*32,py=playerPos.y*32;
  ctx.fillStyle="rgba(20,30,18,.35)";ctx.fillRect(px+8,py+26,16,4);
  ctx.fillStyle="#315b8b";ctx.fillRect(px+10,py+15,12,10);
  ctx.fillStyle="#f1c38e";ctx.fillRect(px+11,py+7,10,9);
  ctx.fillStyle="#5a3826";ctx.fillRect(px+10,py+5,11,4);
  ctx.fillStyle="#ead8b4";
  ctx.fillRect(px+7,py+24,7,5);ctx.fillRect(px+18,py+24,7,5);

}

function drawHomeFurniture(ctx){
  ctx.fillStyle="#8b5b3b";ctx.fillRect(5*32,2*32,5*32,2*32);
  ctx.fillStyle="#b77b49";ctx.fillRect(6*32,2*32+4,3*32,32);
  ctx.fillStyle="#d8b67d";
  for(const x of [6,7,8]){ctx.beginPath();ctx.arc(x*32+16,2*32+16,7,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle="#70472f";ctx.fillRect(2*32,2*32,2*32,3*32);
  ctx.fillStyle="#d9bd86";ctx.fillRect(2*32+5,2*32+5,54,54);
  ctx.fillStyle="#6f4a35";ctx.fillRect(11*32,1*32,2*32,3*32);
  ctx.fillStyle="#f2d58e";ctx.fillRect(11*32+5,1*32+5,54,54);
  ctx.fillStyle="#fff1bd";ctx.font="bold 8px system-ui";ctx.textAlign="center";ctx.fillText("CHOISIS TON COMPAGNON",7.5*32,4*32-5);
  drawStarterSprite(ctx,6*32+16,2*32+16,"Salamèche");
  drawStarterSprite(ctx,7*32+16,2*32+16,"Néréide");
  drawStarterSprite(ctx,8*32+16,2*32+16,"Mousselet");
}
function drawStarterSprite(ctx,x,y,type){
  ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(30,25,15,.2)";ctx.fillRect(-9,8,18,3);
  if(type==="Salamèche"){ctx.fillStyle="#e96b39";ctx.fillRect(-8,-6,16,13);ctx.fillStyle="#f29a50";ctx.fillRect(-5,-11,10,7);ctx.fillStyle="#e0c48b";ctx.fillRect(-5,-2,2,2);ctx.fillRect(3,-2,2,2);ctx.fillStyle="#f4b13e";ctx.fillRect(8,-11,3,7)}
  else if(type==="Néréide"){ctx.fillStyle="#4d9fbe";ctx.fillRect(-9,-5,18,13);ctx.fillStyle="#79c8d4";ctx.fillRect(-6,-10,12,7);ctx.fillStyle="#d4efe5";ctx.fillRect(-4,-1,2,2);ctx.fillRect(3,-1,2,2)}
  else{ctx.fillStyle="#719f4b";ctx.fillRect(-9,-4,18,14);ctx.fillStyle="#94bd5c";ctx.fillRect(-6,-10,12,8);ctx.fillStyle="#e2dcae";ctx.fillRect(-4,-1,2,2);ctx.fillRect(3,-1,2,2)}
  ctx.restore();
}
function renderMap(){
  const canvas=document.getElementById("map");if(!canvas)return;
  const ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;
  if(currentScene==="home"){
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){const X=x*32,Y=y*32;ctx.fillStyle=(x+y)%2?"#c89460":"#cf9d68";ctx.fillRect(X,Y,32,32);ctx.fillStyle="#a96f49";ctx.fillRect(X,Y+30,32,2)}
    ctx.fillStyle="#5f4534";ctx.fillRect(0,0,480,8);ctx.fillRect(0,0,8,352);ctx.fillRect(472,0,8,352);ctx.fillRect(0,344,480,8);
    drawHomeFurniture(ctx);
  }else{
    for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){const ch=mapData[y][x];if(ch==="T")drawPixelTree(ctx,x,y);else if(ch==="G")drawGrass(ctx,x,y);else if(ch==="P")drawPath(ctx,x,y);else if(ch==="W")drawWater(ctx,x,y);else if(ch==="H"||ch==="R")drawHouse(ctx,x,y,ch);else if(ch==="F")drawFence(ctx,x,y);else{ctx.fillStyle="#76a94c";ctx.fillRect(x*32,y*32,32,32)}}
  }
  drawPlayer(ctx);
}
function handleStarterTap(e){
  if(currentScene!=="home"||starterChosen)return;
  const c=document.getElementById("map"),r=c.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/(r.width/MAP_W)),y=Math.floor((e.clientY-r.top)/(r.height/MAP_H));
  if(y===2&&x===6)chooseStarter("Salamèche");
  else if(y===2&&x===7)chooseStarter("Néréide");
  else if(y===2&&x===8)chooseStarter("Mousselet");
}
document.addEventListener("click",e=>{if(e.target.closest("#map"))handleStarterTap(e)});
function isWalkable(x,y){
  if(x<0 || y<0 || x>=MAP_W || y>=MAP_H) return false;
  return tileInfo(mapData[y][x]).walk;
}

function movePlayer(dx,dy){
  if(!document.getElementById("exploreScreen").classList.contains("active")) return;
  if(dx<0) facing="left";
  if(dx>0) facing="right";
  if(dy<0) facing="up";
  if(dy>0) facing="down";
  const nx = playerPos.x + dx;
  const ny = playerPos.y + dy;
  if(currentScene==="home" && dx===0 && dy<0 && playerPos.y===1 && playerPos.x===7){
    if(!starterChosen){document.getElementById("exploreLog").textContent="Choisis un compagnon avant de sortir.";return;}
    currentScene="village"; mapData=MAPS[1].layout.slice(); playerPos={x:7,y:8};
    document.getElementById("exploreLog").textContent="Tu sors de chez toi. Le Bourg de Valbois s'éveille.";
    buildMap(); updateExploreUI(); return;
  }
  if(currentScene==="village" && dx===0 && dy>0 && playerPos.y===9 && playerPos.x===7){
    currentScene="route"; mapData=MAPS[2].layout.slice(); playerPos={x:7,y:1};
    document.getElementById("exploreLog").textContent="La route s'étire vers les hautes herbes.";
    buildMap(); updateExploreUI(); return;
  }
  if(!isWalkable(nx,ny)){
    document.getElementById("exploreLog").textContent = "Tu ne peux pas passer par là.";
    renderMap();
    return;
  }

  playerPos = {x:nx,y:ny};
renderMap();
  updateExploreUI();

  const terrain = mapData[ny][nx];
  if(terrain==="G"){
    const messages = [
      "Les hautes herbes bruissent autour de toi...",
      "Tu avances dans les hautes herbes.",
      "Quelque chose semble bouger non loin..."
    ];
    document.getElementById("exploreLog").textContent =
      messages[Math.floor(Math.random()*messages.length)];

    if(Math.random() < MAPS[areaIndex].encounterRate){
      startWildEncounter();
      return;
    }
  } else {
    document.getElementById("exploreLog").textContent =
      "Tu suis le chemin tranquillement.";
  }

  if(Math.random()<.025){
    coins += randomInt(1,3);
    document.getElementById("exploreLog").textContent += " Tu trouves quelques éclats au sol.";
    updateExploreUI();
  }
}

function startWildEncounter(){
  const species = SPECIES[Math.floor(Math.random()*SPECIES.length)];
  enemy = generateMonster(species);
  battleOver = false;
  const alive = playerTeam.findIndex(m=>m.hp>0);
  if(alive>=0) activeIndex=alive;
  else {
    playerTeam.forEach(m=>m.hp=m.maxHp);
    activeIndex=0;
  }
  showCombat();
  document.getElementById("message").textContent =
    "⚠️ Une créature sauvage surgit des hautes herbes : " + enemy.name + " !";
  render();
}

function showExplore(logText){
  document.getElementById("combatScreen").classList.remove("active");
  document.getElementById("exploreScreen").classList.add("active");
  if(logText)document.getElementById("exploreLog").textContent=logText;
  updateExploreUI();renderMap();
}

function showCombat(){
  document.getElementById("exploreScreen").classList.remove("active");
  document.getElementById("combatScreen").classList.add("active");
}

function updateExploreUI(){
  document.getElementById("areaTitle").textContent=currentScene==="home"?"Maison du professeur":currentScene==="village"?"Bourg de Valbois":"Route des Herbes";
  document.getElementById("coins").textContent=coins;
  document.getElementById("exploreTeam").innerHTML=playerTeam.length?playerTeam.map(m=>'<div class="explore-team-row"><span>'+m.icon+' <b>'+m.name+'</b></span><span>'+m.hp+'/'+m.maxHp+' PV</span></div>').join(""):'<div class="explore-team-row">Aucun compagnon</div>';
}

function changeArea(){
  areaIndex = (areaIndex + 1) % MAPS.length;
  mapData = MAPS[areaIndex].layout.slice();
  playerPos = {x:7,y:5};
  document.getElementById("exploreLog").textContent =
    "Tu arrives dans " + MAPS[areaIndex].name + ".";
  buildMap();
  updateExploreUI();
}

document.addEventListener("keydown", e=>{
  if(!document.getElementById("exploreScreen").classList.contains("active")) return;
  const keys = {
    ArrowUp:[0,-1], w:[0,-1], z:[0,-1],
    ArrowDown:[0,1], s:[0,1],
    ArrowLeft:[-1,0], a:[-1,0], q:[-1,0],
    ArrowRight:[1,0], d:[1,0]
  };
  const move = keys[e.key];
  if(move){
    e.preventDefault();
    movePlayer(move[0],move[1]);
  }
});


currentScene="home";mapData=MAPS[0].layout.slice();playerPos={x:7,y:4};buildMap();showExplore();

<script>
const TILE=32;
function fill(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function tile(c,x,y,col){fill(c,x*TILE,y*TILE,TILE,TILE,col)}
function noise(x,y){return ((x*374761+y*668265+17)%97)/97}

function grassTile(c,x,y){
  tile(c,x,y,noise(x,y)>.5?"#79a84e":"#74a14a");
  c.fillStyle="#4c813e";
  for(let i=0;i<3;i++){const q=(noise(x+i,y)*26)|0;c.fillRect(x*TILE+q+2,y*TILE+22-(i%2)*4,2,7);}
  if(noise(x+9,y+2)>.9){c.fillStyle="#e7d98d";c.fillRect(x*TILE+7,y*TILE+8,3,3);}
}
function pathTile(c,x,y){
  tile(c,x,y,noise(x,y)>.5?"#cdb67b":"#c6ad70");
  c.fillStyle="#aa8e58";c.fillRect(x*TILE+5+(noise(x,y)*15|0),y*TILE+8,3,2);c.fillRect(x*TILE+21-(noise(y,x)*8|0),y*TILE+24,2,2);
}
function waterTile(c,x,y){
  tile(c,x,y,"#4d91ad");c.fillStyle="#76bcc8";
  const off=((x+y)&1)*4;
  c.fillRect(x*TILE+3,y*TILE+8+off,11,2);c.fillRect(x*TILE+17,y*TILE+19,10,2);c.fillRect(x*TILE+7,y*TILE+29-off,12,2);
}
function treeTile(c,x,y){
  tile(c,x,y,"#6e9b50");
  fill(c,x*TILE+3,y*TILE+11,26,18,"#285c38");
  fill(c,x*TILE+7,y*TILE+5,18,20,"#3d7742");
  fill(c,x*TILE+11,y*TILE+1,10,16,"#57904b");
  fill(c,x*TILE+14,y*TILE+24,5,8,"#67462e");
}
function houseTile(c,x,y){
  tile(c,x,y,"#d8bc7c");
  fill(c,x*TILE+2,y*TILE+3,28,7,"#9c4f3d");
  fill(c,x*TILE+5,y*TILE+11,22,10,"#7c9c98");
  fill(c,x*TILE+7,y*TILE+13,8,6,"#d8eee2");
  fill(c,x*TILE+18,y*TILE+22,8,10,"#765033");
}
function drawSign(c,x,y){
  fill(c,x*TILE+7,y*TILE+11,18,13,"#d8bb78");fill(c,x*TILE+14,y*TILE+24,4,8,"#785337");
  fill(c,x*TILE+9,y*TILE+13,14,2,"#7b5a3b");
}
function drawFlower(c,x,y){
  const X=x*TILE+16,Y=y*TILE+16;c.fillStyle="#e9d98f";c.fillRect(X-2,Y-2,4,4);c.fillStyle="#d66a62";
  c.fillRect(X-5,Y-1,3,3);c.fillRect(X+2,Y-1,3,3);c.fillRect(X-1,Y-5,3,3);c.fillRect(X-1,Y+2,3,3);
}
function drawPlayer(c){
  const X=playerPos.x*TILE,Y=playerPos.y*TILE;
  fill(c,X+7,Y+27,18,3,"rgba(24,31,19,.32)");
  fill(c,X+9,Y+14,14,12,"#315d8f");fill(c,X+10,Y+6,12,10,"#efc18a");
  fill(c,X+9,Y+4,14,6,"#4b3427");fill(c,X+7,Y+25,8,5,"#ead6aa");fill(c,X+17,Y+25,8,5,"#ead6aa");
  fill(c,X+12,Y+10,2,2,"#fff");fill(c,X+19,Y+10,2,2,"#fff");
}
function starterSprite(c,x,y,type){
  const X=x*TILE+16,Y=y*TILE+16;
  c.fillStyle="rgba(20,25,18,.25)";c.fillRect(X-11,Y+10,22,3);
  if(type==="Salamèche"){
    fill(c,X-10,Y-5,20,14,"#d85d37");fill(c,X-7,Y-12,14,8,"#ed7940");fill(c,X-4,Y-16,8,6,"#f3a342");
    fill(c,X-6,Y-3,4,4,"#f4d07b");fill(c,X+3,Y-3,4,4,"#f4d07b");fill(c,X+9,Y-10,4,9,"#e6a33e");
  } else if(type==="Néréide"){
    fill(c,X-11,Y-5,22,14,"#438eaa");fill(c,X-7,Y-12,14,8,"#63b5c3");fill(c,X-4,Y-16,8,6,"#8bd0cf");
    fill(c,X-6,Y-3,3,3,"#e7f0df");fill(c,X+3,Y-3,3,3,"#e7f0df");
  } else {
    fill(c,X-11,Y-5,22,14,"#5f9349");fill(c,X-7,Y-12,14,8,"#83ae55");fill(c,X-4,Y-16,8,7,"#a9c968");
    fill(c,X-6,Y-3,3,3,"#e8e2b2");fill(c,X+3,Y-3,3,3,"#e8e2b2");fill(c,X-13,Y-11,5,7,"#4b7d3c");fill(c,X+8,Y-11,5,7,"#4b7d3c");
  }
}
function renderHome(c){
  for(let y=0;y<11;y++)for(let x=0;x<15;x++)tile(c,x,y,(x+y)%2?"#cb955f":"#d4a069");
  fill(c,0,0,480,8,"#51372a");fill(c,0,0,8,352,"#51372a");fill(c,472,0,8,352,"#51372a");fill(c,0,344,480,8,"#51372a");
  // bed
  fill(c,32,64,96,96,"#704935");fill(c,38,70,84,50,"#e8d7ad");fill(c,44,73,72,17,"#b8c9bf");
  // starter table
  fill(c,160,64,160,64,"#6f472f");fill(c,166,69,148,48,"#9b633d");
  for(let x=6;x<=8;x++){c.fillStyle="#ead18d";c.beginPath();c.arc(x*TILE+16,80,12,0,Math.PI*2);c.fill();}
  starterSprite(c,6,2,"Salamèche");starterSprite(c,7,2,"Néréide");starterSprite(c,8,2,"Mousselet");
  // bookshelf + desk
  fill(c,352,64,64,96,"#66452f");for(let i=0;i<4;i++)fill(c,357,71+i*20,54,11,i%2?"#b95e43":"#5d7e55");
  fill(c,352,192,64,64,"#704936");fill(c,357,197,54,54,"#b77d4d");
  // windows
  for(const x of [5,10]){fill(c,x*TILE,8,64,20,"#704b35");fill(c,x*TILE+5,11,54,14,"#82b9c4");fill(c,x*TILE+30,11,4,14,"#e2cb91");}
  // rug + door
  fill(c,160,192,160,64,"#895a45");fill(c,165,197,150,54,"#d5b36f");fill(c,232,0,16,10,"#b47b4d");
  c.fillStyle="#f5e6af";c.font="bold 8px monospace";c.textAlign="center";c.fillText("TABLE DES COMPAGNONS",240,151);
}
function renderWorld(c){
  for(let y=0;y<11;y++)for(let x=0;x<15;x++){
    const ch=mapData[y][x];
    if(ch==="T")treeTile(c,x,y);else if(ch==="G")grassTile(c,x,y);else if(ch==="P")pathTile(c,x,y);else if(ch==="W")waterTile(c,x,y);else if(ch==="H")houseTile(c,x,y);else tile(c,x,y,"#74a14a");
  }
  if(currentScene==="village"){
    drawSign(c,2,7);drawSign(c,12,3);
    for(const [x,y] of [[5,5],[9,5],[4,8],[10,8]])drawFlower(c,x,y);
    // plaza stones
    for(const [x,y] of [[6,6],[8,6],[6,8],[8,8]]){c.fillStyle="#e1cf9d";c.fillRect(x*TILE+10,y*TILE+10,12,12);}
  }
  if(currentScene==="route"){
    for(const [x,y] of [[2,2],[12,3],[3,7],[11,8],[13,6]])drawFlower(c,x,y);
  }
}
function renderPolishedMap(){
  const c=document.getElementById("map");if(!c)return;
  const w=Math.max(320,Math.floor(c.clientWidth||window.innerWidth));
  const h=Math.max(240,Math.floor(c.clientHeight||window.innerHeight-34));
  c.width=w;c.height=h;c.imageSmoothingEnabled=false;
  c.clearRect(0,0,w,h);
  const scale=Math.min(w/480,h/352);
  const ox=(w-480*scale)/2,oy=(h-352*scale)/2;
  c.save();c.translate(ox,oy);c.scale(scale,scale);
  if(currentScene==="home")renderHome(c);else renderWorld(c);drawPlayer(c);
  c.restore();
}
window.renderMap=renderPolishedMap;
window.buildMap=function(){renderPolishedMap();};
renderPolishedMap();
window.addEventListener("resize",()=>renderPolishedMap());
window.addEventListener("orientationchange",()=>setTimeout(renderPolishedMap,100));
</script>
</body></html>

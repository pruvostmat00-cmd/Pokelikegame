<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokelikegame — Prototype</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #151515;
  color: #fff;
  font-family: Arial, sans-serif;
}

#game {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  padding: 12px;
  background: #202020;
}

h1 {
  text-align: center;
  font-size: 22px;
  margin: 5px 0 12px;
}

.arena {
  background: #292929;
  border-radius: 18px;
  padding: 12px;
  margin-bottom: 10px;
}

.monster-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.monster-icon {
  font-size: 58px;
  width: 70px;
  text-align: center;
}

.monster-info {
  flex: 1;
}

.monster-name {
  font-size: 19px;
  font-weight: bold;
}

.types {
  font-size: 13px;
  opacity: .8;
  margin: 3px 0 7px;
}

.hp-bg {
  width: 100%;
  height: 14px;
  background: #555;
  border-radius: 8px;
  overflow: hidden;
}

.hp {
  height: 100%;
  width: 100%;
  background: #49c95b;
  transition: width .3s;
}

.hp-text {
  font-size: 12px;
  margin-top: 3px;
}

.status {
  text-align: center;
  min-height: 42px;
  padding: 8px;
  font-size: 15px;
}

.attacks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.attack {
  border: 0;
  border-radius: 12px;
  padding: 10px;
  background: #383838;
  color: white;
  text-align: left;
  min-height: 70px;
  font-size: 14px;
}

.attack:active {
  transform: scale(.97);
}

.attack-name {
  font-weight: bold;
  font-size: 15px;
}

.attack-info {
  margin-top: 5px;
  font-size: 11px;
  opacity: .8;
}

.attack:disabled {
  opacity: .35;
}

.team {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.team button {
  flex: 1;
  padding: 8px 4px;
  border: 0;
  border-radius: 10px;
  background: #333;
  color: white;
  font-size: 12px;
}

.team button.active {
  outline: 2px solid white;
}

.team button:disabled {
  opacity: .3;
}

.panel {
  background: #292929;
  border-radius: 15px;
  padding: 10px;
  margin-top: 10px;
}

.panel-title {
  font-weight: bold;
  margin-bottom: 7px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  font-size: 12px;
}

.stat {
  background: #333;
  padding: 5px;
  border-radius: 6px;
}

.reset {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  background: #555;
  color: white;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="game">

<h1>⚔️ Pokelikegame</h1>

<div class="arena">

  <div class="monster-row">

    <div class="monster-icon" id="enemyIcon">💧</div>

    <div class="monster-info">

      <div class="monster-name" id="enemyName">Néréide</div>

      <div class="types" id="enemyTypes">Eau</div>

      <div class="hp-bg">
        <div class="hp" id="enemyHpBar"></div>
      </div>

      <div class="hp-text">
        PV : <span id="enemyHpText">100</span> / <span id="enemyMaxHp">100</span>
      </div>

    </div>

  </div>

</div>


<div class="status" id="message">
  À toi de jouer.
</div>


<div class="arena">

  <div class="monster-row">

    <div class="monster-icon" id="playerIcon">🔥</div>

    <div class="monster-info">

      <div class="monster-name" id="playerName">Salamèche</div>

      <div class="types" id="playerTypes">Feu</div>

      <div class="hp-bg">
        <div class="hp" id="playerHpBar"></div>
      </div>

      <div class="hp-text">
        PV : <span id="playerHpText">100</span> / <span id="playerMaxHp">100</span>
      </div>

    </div>

  </div>

</div>


<div class="panel">

  <div class="panel-title">Ton équipe</div>

  <div class="team" id="teamButtons"></div>

</div>


<div class="panel">

  <div class="panel-title">Attaques</div>

  <div class="attacks" id="attacks"></div>

</div>


<div class="panel">

  <div class="panel-title">Statistiques</div>

  <div class="stats" id="stats"></div>

  <div style="font-size:12px;margin-top:7px;">
    Talent : <b id="talent">—</b>
  </div>

</div>


<button class="reset" onclick="newBattle()">
  🔄 Nouveau combat
</button>

</div>

let playerTeam = [];
let enemy = null;
let activeIndex = 0;
let battleOver = false;


function randomInt(min,max) {
  return Math.floor(Math.random() * (max-min+1)) + min;
}


function generateMonster(species) {

  const s = species.stats;

  const monster = {
    name: species.name,
    icon: species.icon,
    types: [...species.types],

    vitalite: randomInt(s.vitalite[0],s.vitalite[1]),
    force: randomInt(s.force[0],s.force[1]),
    puissance: randomInt(s.puissance[0],s.puissance[1]),
    resistance: randomInt(s.resistance[0],s.resistance[1]),
    vitesse: randomInt(s.vitesse[0],s.vitesse[1]),

    talent: species.talent,

    attacks: species.attacks
      .slice()
      .sort(() => Math.random() - .5)
      .slice(0,4)
      .map(a => ({
        name:a[0],
        type:a[1],
        category:a[2],
        power:a[3],
        accuracy:a[4]
      }))
  };

  monster.maxHp = monster.vitalite;
  monster.hp = monster.maxHp;

  return monster;
}


function effectiveness(attackType, defenderTypes) {

  let multiplier = 1;

  defenderTypes.forEach(type => {

    if (TYPES[attackType] && TYPES[attackType][type]) {
      multiplier *= TYPES[attackType][type];
    }

  });

  return multiplier;
}


function formatMultiplier(value) {

  if (value === 1.5) return "×1,5";
  if (value === 0.7) return "×0,7";
  if (value === 2.25) return "×2,25";
  if (value === 0.49) return "×0,49";

  return "×" + value;
}


function iconForCategory(category) {

  if (category === "Physique") return "⚔️";
  if (category === "Spéciale") return "✨";
  return "🌀";

}


function render() {

  const player = playerTeam[activeIndex];

  document.getElementById("playerIcon").textContent = player.icon;
  document.getElementById("playerName").textContent = player.name;
  document.getElementById("playerTypes").textContent = player.types.join(" / ");

  document.getElementById("enemyIcon").textContent = enemy.icon;
  document.getElementById("enemyName").textContent = enemy.name;
  document.getElementById("enemyTypes").textContent = enemy.types.join(" / ");

  updateHp("player",player);
  updateHp("enemy",enemy);

  renderTeam();
  renderAttacks();
  renderStats();

}


function updateHp(side,monster) {

  const percent = Math.max(0,(monster.hp / monster.maxHp) * 100);

  document.getElementById(side + "HpBar").style.width = percent + "%";
  document.getElementById(side + "HpText").textContent = monster.hp;
  document.getElementById(side + "MaxHp").textContent = monster.maxHp;

}


function renderTeam() {

  const container = document.getElementById("teamButtons");

  container.innerHTML = "";

  playerTeam.forEach((monster,index) => {

    const button = document.createElement("button");

    button.textContent =
      monster.icon + " " +
      monster.name +
      " (" + monster.hp + "/" + monster.maxHp + ")";

    if (index === activeIndex) {
      button.classList.add("active");
    }

    if (monster.hp <= 0) {
      button.disabled = true;
    }

    button.onclick = () => switchMonster(index);

    container.appendChild(button);

  });

}


function renderAttacks() {

  const container = document.getElementById("attacks");

  container.innerHTML = "";

  const player = playerTeam[activeIndex];

  player.attacks.forEach(attack => {

    const button = document.createElement("button");

    button.className = "attack";

    const multiplier =
      effectiveness(attack.type,enemy.types);

    button.innerHTML = `
      <div class="attack-name">
        ${iconForCategory(attack.category)} ${attack.name}
      </div>

      <div class="attack-info">
        ${attack.type} · ${attack.category} ·
        ${attack.power > 0 ? attack.power + " PUI · " : ""}
        ${attack.accuracy}% ·
        ${formatMultiplier(multiplier)}
      </div>
    `;

    button.disabled =
      battleOver ||
      player.hp <= 0 ||
      enemy.hp <= 0;

    button.onclick = () => useAttack(attack);

    container.appendChild(button);

  });

}


function renderStats() {

  const player = playerTeam[activeIndex];

  document.getElementById("stats").innerHTML = `

    <div class="stat">❤️ Vitalité : ${player.vitalite}</div>
    <div class="stat">⚔️ Force : ${player.force}</div>
    <div class="stat">✨ Puissance : ${player.puissance}</div>
    <div class="stat">🛡️ Résistance : ${player.resistance}</div>
    <div class="stat">💨 Vitesse : ${player.vitesse}</div>

  `;

  document.getElementById("talent").textContent =
    player.talent;

}


function useAttack(attack) {

  if (battleOver) return;

  const player = playerTeam[activeIndex];

  if (player.hp <= 0 || enemy.hp <= 0) return;

  let hit =
    Math.random() * 100 <= attack.accuracy;

  if (!hit) {

    document.getElementById("message").textContent =
      player.name + " utilise " +
      attack.name +
      " mais rate !";

    setTimeout(enemyTurn,700);

    return;
  }


  if (attack.category === "Statut") {

    document.getElementById("message").textContent =
      player.name + " utilise " +
      attack.name + " !";

    setTimeout(enemyTurn,700);

    return;
  }


  let attackStat =
    attack.category === "Physique"
    ? player.force
    : player.puissance;


  let defense =
    enemy.resistance;


  const multiplier =
    effectiveness(attack.type,enemy.types);


  let damage =
    Math.max(
      1,
      Math.round(
        (attack.power * attackStat / Math.max(20,defense))
        * 0.35
        * multiplier
      )
    );


  let critical =
    Math.random() < 0.08;


  if (critical) {
    damage = Math.round(damage * 1.5);
  }


  enemy.hp =
    Math.max(0,enemy.hp - damage);


  let text =
    player.name +
    " utilise " +
    attack.name +
    " : -" +
    damage +
    " PV";


  if (critical) {
    text += " ✨ CRITIQUE !";
  }


  document.getElementById("message").textContent =
    text;


  render();


  if (enemy.hp <= 0) {

    battleOver = true;

    document.getElementById("message").textContent =
      "🏆 Victoire ! " +
      enemy.name +
      " est K.O.";

    renderAttacks();

    return;
  }


  setTimeout(enemyTurn,700);

}


function enemyTurn() {

  if (battleOver || enemy.hp <= 0) return;

  const player = playerTeam[activeIndex];

  const attacks = SPECIES
    .find(s => s.name === enemy.name)
    .attacks;

  const raw =
    attacks[Math.floor(Math.random() * attacks.length)];


  const attack = {
    name:raw[0],
    type:raw[1],
    category:raw[2],
    power:raw[3],
    accuracy:raw[4]
  };


  if (Math.random() * 100 > attack.accuracy) {

    document.getElementById("message").textContent =
      enemy.name +
      " utilise " +
      attack.name +
      " mais rate !";

    return;
  }


  if (attack.category === "Statut") {

    document.getElementById("message").textContent =
      enemy.name +
      " utilise " +
      attack.name +
      " !";

    return;
  }


  const attackStat =
    attack.category === "Physique"
    ? enemy.force
    : enemy.puissance;


  const multiplier =
    effectiveness(attack.type,player.types);


  let damage =
    Math.max(
      1,
      Math.round(
        (attack.power * attackStat /
        Math.max(20,player.resistance))
        * 0.35
        * multiplier
      )
    );


  player.hp =
    Math.max(0,player.hp - damage);


  document.getElementById("message").textContent =
    enemy.name +
    " utilise " +
    attack.name +
    " : -" +
    damage +
    " PV";


  render();


  if (player.hp <= 0) {

    const alive =
      playerTeam.some(m => m.hp > 0);

    if (alive) {

      document.getElementById("message").textContent =
        player.name +
        " est K.O. ! Choisis un autre monstre.";

    } else {

      battleOver = true;

      document.getElementById("message").textContent =
        "💀 Toute ton équipe est K.O.";

    }

  }

}


function switchMonster(index) {

  if (battleOver) return;

  if (index === activeIndex) return;

  if (playerTeam[index].hp <= 0) return;

  activeIndex = index;

  document.getElementById("message").textContent =
    "Tu envoies " +
    playerTeam[index].name +
    " !";

  render();

}


function newBattle() {

  battleOver = false;

  activeIndex = 0;

  playerTeam = [];

  while (playerTeam.length < 3) {

    const species =
      SPECIES[
        Math.floor(Math.random() * SPECIES.length)
      ];

    playerTeam.push(generateMonster(species));

  }


  const enemySpecies =
    SPECIES[
      Math.floor(Math.random() * SPECIES.length)
    ];


  enemy =
    generateMonster(enemySpecies);


  document.getElementById("message").textContent =
    "À toi de jouer.";


  render();

}


newBattle();

</script>

</html>
